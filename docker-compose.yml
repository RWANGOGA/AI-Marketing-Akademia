services:
  db:
    image: postgres:16-alpine
    container_name: akademia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [akademia_net]
    # no "ports:" — only reachable by other containers on akademia_net

  backend:
    build: ./backend
    container_name: akademia_backend
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    ports:
      - "8000:8000"
    networks: [akademia_net]

networks:
  akademia_net:
    driver: bridge

volumes:
  db_data:
