<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Markerter — Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #F6F7F3;
      --surface: #FFFFFF;
      --surface-alt: #EEF1EA;
      --ink: #16211C;
      --ink-muted: #5C6B62;
      --ink-faint: #8B978E;
      --border: #DCE1D7;
      --brand: #1F6F5C;
      --brand-dark: #123D33;
      --brand-tint: #E4EFEC;
      --accent: #C2661C;
      --accent-tint: #FBEADB;
      --danger: #B3261E;
      --danger-tint: #FBE7E5;
      --good: #2E7D4F;
      --good-tint: #E4F1E9;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(20, 30, 25, 0.06), 0 1px 1px rgba(20, 30, 25, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'IBM Plex Mono', monospace;
    }

    h1,
    h2,
    h3,
    .display {
      font-family: 'Space Grotesk', sans-serif;
    }

    a {
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    ::selection {
      background: var(--brand-tint);
    }

    /* ---------- App shell ---------- */
    #app {
      display: flex;
      min-height: 100vh;
    }

    .nav {
      width: 220px;
      flex-shrink: 0;
      background: var(--brand-dark);
      color: #EAF3EF;
      display: flex;
      flex-direction: column;
      padding: 18px 12px;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 10px 22px 10px;
    }

    .nav-brand .mark {
      width: 26px;
      height: 26px;
      border-radius: 7px;
      background: linear-gradient(135deg, #3FA98A, #1F6F5C);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk';
      font-weight: 700;
      font-size: 13px;
      color: #fff;
      flex-shrink: 0;
    }

    .nav-brand .name {
      font-family: 'Space Grotesk';
      font-weight: 600;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .nav-brand .sub {
      font-size: 10px;
      color: #9FC3B7;
      font-family: 'IBM Plex Mono';
      letter-spacing: 0.4px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-top: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 500;
      color: #C9DED6;
      background: transparent;
      border: none;
      text-align: left;
      width: 100%;
    }

    .nav-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: 0.85;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .nav-item.active {
      background: #1B5A4A;
      color: #fff;
    }

    .nav-item .badge {
      margin-left: auto;
      font-family: 'IBM Plex Mono';
      font-size: 10.5px;
      background: var(--accent);
      color: #fff;
      border-radius: 20px;
      padding: 1px 6px;
    }

    .nav-foot {
      margin-top: auto;
      padding: 10px;
      font-size: 11px;
      color: #7FA598;
      font-family: 'IBM Plex Mono';
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .topbar .crumb {
      font-size: 13px;
      color: var(--ink-muted);
    }

    .topbar .crumb b {
      color: var(--ink);
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--brand);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      font-family: 'Space Grotesk';
    }

    #workspace {
      flex: 1;
      padding: 26px 30px 60px 30px;
      overflow-y: auto;
    }

    .view {
      max-width: 1180px;
    }

    .view-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .view-header h1 {
      font-size: 22px;
      margin: 0 0 4px 0;
      font-weight: 600;
    }

    .view-header p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 13.5px;
    }

    /* ---------- Buttons ---------- */
    .btn {
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn:hover {
      border-color: #B9C2B4;
    }

    .btn-primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--brand-dark);
    }

    .btn-danger {
      background: var(--danger-tint);
      border-color: #F1C4C0;
      color: var(--danger);
    }

    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--ink-muted);
    }

    .btn-ghost:hover {
      background: var(--surface-alt);
      color: var(--ink);
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: 7px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* ---------- Cards / surfaces ---------- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .pad {
      padding: 18px;
    }

    /* ---------- Dashboard ---------- */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-card {
      padding: 16px 16px 14px 16px;
    }

    .stat-card .label {
      font-size: 11.5px;
      color: var(--ink-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .stat-card .num {
      font-family: 'Space Grotesk';
      font-size: 28px;
      font-weight: 700;
      margin-top: 6px;
    }

    .stat-card .delta {
      font-size: 11.5px;
      margin-top: 4px;
      color: var(--ink-faint);
    }

    .pipeline {
      display: flex;
      align-items: center;
      padding: 20px 22px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .pl-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 88px;
      flex-shrink: 0;
    }

    .pl-node {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--brand-tint);
      border: 2px solid var(--brand);
      color: var(--brand-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk';
      font-weight: 700;
      font-size: 15px;
    }

    .pl-label {
      font-size: 10.5px;
      font-family: 'IBM Plex Mono';
      color: var(--ink-muted);
      text-align: center;
      letter-spacing: 0.2px;
    }

    .pl-line {
      flex: 1;
      height: 2px;
      background: repeating-linear-gradient(90deg, var(--border) 0 6px, transparent 6px 10px);
      margin: 0 4px 22px 4px;
      min-width: 20px;
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 16px;
    }

    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .attn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--surface-alt);
    }

    .attn-row:last-child {
      border-bottom: none;
    }

    .attn-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .attn-row .co {
      font-weight: 600;
      font-size: 13px;
    }

    .attn-row .why {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .attn-row .go {
      margin-left: auto;
    }

    .feed-row {
      display: flex;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid var(--surface-alt);
      font-size: 12.5px;
    }

    .feed-row:last-child {
      border-bottom: none;
    }

    .feed-row .t {
      color: var(--ink-faint);
      font-family: 'IBM Plex Mono';
      font-size: 11px;
      width: 44px;
      flex-shrink: 0;
      padding-top: 1px;
    }

    .automation-strip {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .auto-chip {
      flex: 1;
      padding: 11px 13px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .auto-chip .name {
      font-size: 12.5px;
      font-weight: 600;
    }

    .auto-chip .st {
      margin-left: auto;
    }

    /* ---------- status pills ---------- */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      font-family: 'IBM Plex Mono';
      white-space: nowrap;
    }

    .pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .pill-new {
      background: #E7ECF5;
      color: #39538C;
    }

    .pill-contacted {
      background: #EFF0E4;
      color: #7A6A16;
    }

    .pill-responded {
      background: var(--accent-tint);
      color: #95470D;
    }

    .pill-meeting {
      background: #E9E4F5;
      color: #5C3D9C;
    }

    .pill-customer {
      background: var(--good-tint);
      color: var(--good);
    }

    .pill-lost {
      background: #F1F1EE;
      color: #8B8D85;
    }

    .pill-followup {
      background: var(--danger-tint);
      color: var(--danger);
    }

    .pill-running {
      background: var(--good-tint);
      color: var(--good);
    }

    .pill-stopped {
      background: #F1F1EE;
      color: #8B8D85;
    }

    .pill-failed {
      background: var(--danger-tint);
      color: var(--danger);
    }

    .pill-completed {
      background: var(--brand-tint);
      color: var(--brand-dark);
    }

    .pill-draft {
      background: #F1F1EE;
      color: #77796F;
    }

    .pill-pending {
      background: var(--accent-tint);
      color: #95470D;
    }

    .pill-approved {
      background: #E7ECF5;
      color: #39538C;
    }

    .pill-sent {
      background: var(--good-tint);
      color: var(--good);
    }

    .pill-published {
      background: var(--good-tint);
      color: var(--good);
    }

    .pill-unpublished {
      background: #F1F1EE;
      color: #8B8D85;
    }

    /* ---------- Tables ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead th {
      text-align: left;
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--ink-muted);
      font-weight: 700;
      padding: 0 12px 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    tbody td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--surface-alt);
      vertical-align: middle;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.clickable:hover {
      background: var(--surface-alt);
      cursor: pointer;
    }

    td.co {
      font-weight: 600;
    }

    td .sub {
      color: var(--ink-muted);
      font-size: 11.5px;
      margin-top: 1px;
    }

    /* ---------- Filters bar ---------- */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filters select,
    .filters input[type=text] {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      background: var(--surface);
      color: var(--ink);
      font-family: inherit;
    }

    .filters input[type=text] {
      min-width: 200px;
    }

    .filters .spacer {
      flex: 1;
    }

    /* ---------- Lead detail ---------- */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12.5px;
      color: var(--ink-muted);
      font-weight: 600;
      margin-bottom: 14px;
      background: none;
      border: none;
      padding: 0;
    }

    .back-link:hover {
      color: var(--ink);
    }

    .ld-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
      align-items: start;
    }

    .ld-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .ld-head h2 {
      margin: 0 0 4px 0;
      font-size: 20px;
    }

    .ld-head .meta {
      color: var(--ink-muted);
      font-size: 12.5px;
    }

    .kv {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 8px 12px;
      font-size: 12.5px;
      margin-top: 4px;
    }

    .kv .k {
      color: var(--ink-muted);
    }

    .block-title {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--ink-muted);
      margin: 0 0 8px 0;
    }

    .insight-box {
      background: var(--brand-tint);
      border: 1px solid #C9DFD6;
      border-radius: 9px;
      padding: 14px 16px;
      margin-top: 10px;
    }

    .insight-box .prod {
      font-family: 'Space Grotesk';
      font-weight: 700;
      font-size: 14.5px;
      color: var(--brand-dark);
    }

    .insight-box p {
      margin: 6px 0 0 0;
      font-size: 12.8px;
      line-height: 1.5;
      color: #1E3A32;
    }

    .discovered-list {
      margin: 8px 0 0 0;
      padding-left: 18px;
      font-size: 12.8px;
      line-height: 1.7;
      color: var(--ink);
    }

    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 13px;
      font-family: 'Inter';
      font-size: 13px;
      line-height: 1.55;
      resize: vertical;
      color: var(--ink);
      background: var(--surface);
    }

    .pitch-toolbar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    select.status-select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12.5px;
      background: var(--surface);
      font-weight: 600;
      font-family: inherit;
    }

    .empty {
      padding: 30px 10px;
      text-align: center;
      color: var(--ink-faint);
      font-size: 13px;
    }

    /* ---------- Modal-ish inline panel ---------- */
    .panel-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 23, 0.35);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 60px 20px;
      z-index: 50;
      overflow-y: auto;
    }

    .panel {
      background: var(--surface);
      border-radius: 12px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
    }

    .panel-head {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-head h3 {
      margin: 0;
      font-size: 15.5px;
    }

    .panel-body {
      padding: 20px;
    }

    .panel-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 5px;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      color: var(--ink);
      background: var(--surface);
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .close-x {
      border: none;
      background: none;
      font-size: 18px;
      color: var(--ink-faint);
      line-height: 1;
      padding: 2px;
    }

    /* ---------- tabs ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab {
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-muted);
      border-bottom: 2px solid transparent;
      background: none;
      border-top: none;
      border-left: none;
      border-right: none;
    }

    .tab.active {
      color: var(--brand-dark);
      border-bottom-color: var(--brand);
    }

    .toast {
      position: fixed;
      bottom: 22px;
      right: 22px;
      background: var(--ink);
      color: #fff;
      padding: 11px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-track {
      height: 7px;
      background: var(--surface-alt);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-fill {
      height: 100%;
      background: var(--brand);
      width: 0%;
      transition: width 0.4s ease;
    }

    /* Content list rows */
    .clist-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--surface-alt);
    }

    .clist-row:last-child {
      border-bottom: none;
    }

    .thumb {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--surface-alt);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink-faint);
      font-size: 16px;
    }

    .clist-title {
      font-weight: 600;
      font-size: 13px;
    }

    .clist-sub {
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .clist-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: #D3D8CD;
      border-radius: 20px;
      border: 2px solid var(--bg);
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    /* ============================= MOCK DATA ============================= */
    const ICONS = {

    /* ============================= EVENT HANDLING ============================= */
    function attachHandlers() {
      document.querySelectorAll('[data-nav]').forEach(el => {
        el.addEventListener('click', (ev) => {
          if (ev.target.closest('[data-open-discovery]') && el.hasAttribute('data-open-discovery')) return;
          const r = el.getAttribute('data-nav');
          state.discoveryOpen = false; state.pitchDraft = null; state.openEmailId = null;
          go(r);
        });
      });
      document.querySelectorAll('[data-open-lead]').forEach(el => {
        el.addEventListener('click', () => { state.pitchDraft = null; go('lead-detail', { selectedLeadId: el.getAttribute('data-open-lead') }); });
      });
      const discBtn = document.querySelector('[data-open-discovery]');
      if (discBtn) discBtn.addEventListener('click', (e) => { e.stopPropagation(); state.route = 'leads'; state.discoveryOpen = true; render(); });

      document.querySelectorAll('[data-close-panel]').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.hasAttribute('data-stop-prop')) return;
          const which = el.getAttribute('data-close-panel');
          if (which === 'discovery') state.discoveryOpen = false;
          if (which === 'newcampaign') state.newCampaignOpen = false;
          if (which === 'email') state.openEmailId = null;
          render();
        });
      });
      document.querySelectorAll('[data-stop-prop]').forEach(el => el.addEventListener('click', e => e.stopPropagation()));

      document.querySelectorAll('[data-filter]').forEach(el => {
        el.addEventListener('input', () => { state.leadFilters[el.getAttribute('data-filter')] = el.value; render(); });
        el.addEventListener('change', () => { state.leadFilters[el.getAttribute('data-filter')] = el.value; render(); });
      });

      const startDiscBtn = document.getElementById('start-discovery-btn');
      if (startDiscBtn) {
        startDiscBtn.addEventListener('click', () => {
          const prog = document.getElementById('discovery-progress');
          const fill = document.getElementById('progress-fill');
          const text = document.getElementById('progress-text');
          prog.style.display = 'block';
          startDiscBtn.disabled = true;
          const steps = [[20, 'Looking for matching companies…'], [55, 'Collecting public business information…'], [80, 'Checking for duplicates…'], [100, 'Done — adding results as new leads.']];
          let i = 0;
          const tick = () => {
            fill.style.width = steps[i][0] + '%';
            text.textContent = steps[i][1];
            i++;
            if (i < steps.length) setTimeout(tick, 650);
            else setTimeout(() => { state.discoveryOpen = false; toast('Discovery finished — 6 new leads added.'); }, 700);
          };
          tick();
        });
      }

      const statusSelect = document.getElementById('status-select');
      if (statusSelect) statusSelect.addEventListener('change', () => {
        const l = LEADS.find(x => x.id === state.selectedLeadId);
        l.status = statusSelect.value;
        toast(`Status updated to “${statusLabel(l.status)}”.`);
        render();
      });
      const productSelect = document.getElementById('product-select');
      if (productSelect) productSelect.addEventListener('change', () => {
        const l = LEADS.find(x => x.id === state.selectedLeadId);
        l.product = productSelect.value;
        toast('Recommended product updated.');
        render();
      });

      const genBtn = document.getElementById('generate-pitch-btn');
      if (genBtn) genBtn.addEventListener('click', () => {
        const l = LEADS.find(x => x.id === state.selectedLeadId);
        state.pitchDraft = samplePitch(l);
        render();
      });
      const regenBtn = document.getElementById('regen-pitch-btn');
      if (regenBtn) regenBtn.addEventListener('click', () => {
        const l = LEADS.find(x => x.id === state.selectedLeadId);
        state.pitchDraft = state.pitchDraft === samplePitch(l) ? altPitch(l) : samplePitch(l);
        render();
      });
      const approveBtn = document.getElementById('approve-pitch-btn');
      if (approveBtn) approveBtn.addEventListener('click', () => {
        const l = LEADS.find(x => x.id === state.selectedLeadId);
        const text = document.getElementById('pitch-text').value;
        l.pitchApproved = true;
        state.pitchDraft = null;
        EMAILS.unshift({ id: 'E-' + Math.floor(Math.random() * 900 + 100), lead: l.company, product: productName(l.product), status: 'approved', subject: `A note for ${l.company}`, body: text });
        toast('Pitch approved — sent to Emails, ready to send.');
        render();
      });
      const discardBtn = document.getElementById('discard-pitch-btn');
      if (discardBtn) discardBtn.addEventListener('click', () => {
        state.pitchDraft = null;
        toast('Pitch discarded.');
        render();
      });

      document.querySelectorAll('[data-open="newcampaign"]').forEach(el => el.addEventListener('click', () => { state.newCampaignOpen = true; render(); }));
      document.querySelectorAll('[data-create-campaign]').forEach(el => el.addEventListener('click', () => { state.newCampaignOpen = false; toast('Campaign created.'); render(); }));
      document.querySelectorAll('[data-toggle-campaign]').forEach(el => {
        el.addEventListener('click', () => {
          const c = CAMPAIGNS.find(x => x.id === el.getAttribute('data-toggle-campaign'));
          c.status = c.status === 'running' ? 'paused' : 'running';
          render();
        });
      });

      document.querySelectorAll('[data-email-filter]').forEach(el => el.addEventListener('click', () => { state.emailFilter = el.getAttribute('data-email-filter'); render(); }));
      document.querySelectorAll('[data-open-email]').forEach(el => el.addEventListener('click', () => { state.openEmailId = el.getAttribute('data-open-email'); render(); }));
      document.querySelectorAll('[data-email-action]').forEach(el => {
        el.addEventListener('click', () => {
          const e = EMAILS.find(x => x.id === el.getAttribute('data-id'));
          const action = el.getAttribute('data-email-action');
          if (action === 'approve') { e.status = 'approved'; toast('Email approved.'); }
          if (action === 'reject') { e.status = 'draft'; toast('Email rejected — sent back to draft.'); }
          if (action === 'regenerate') { toast('Regenerating message…'); }
          if (action === 'send') { e.status = 'sent'; toast('Email sent.'); state.openEmailId = null; }
          render();
        });
      });

      document.querySelectorAll('[data-toggle-auto]').forEach(el => {
        el.addEventListener('click', () => {
          const a = AUTOMATIONS[parseInt(el.getAttribute('data-toggle-auto'))];
          a.status = a.status === 'running' ? 'stopped' : 'running';
          if (a.status === 'running') a.lastRun = 'just now';
          render();
        });
      });

      document.querySelectorAll('[data-toggle-product]').forEach(el => {
        el.addEventListener('click', () => {
          const p = PRODUCTS.find(x => x.id === el.getAttribute('data-toggle-product'));
          p.published = !p.published;
          toast(p.published ? 'Product published to website.' : 'Product unpublished.');
          render();
        });
      });
      document.querySelectorAll('[data-edit-product]').forEach(el => el.addEventListener('click', () => toast('Opens the product edit form.')));
      document.querySelectorAll('[data-add-product]').forEach(el => el.addEventListener('click', () => toast('Opens a blank product form.')));

      document.querySelectorAll('[data-content-tab]').forEach(el => el.addEventListener('click', () => { state.contentTab = el.getAttribute('data-content-tab'); render(); }));
      document.querySelectorAll('[data-toggle-content]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-toggle-content');
          const list = { blogs: BLOGS, news: NEWS, quotes: QUOTES }[state.contentTab];
          const item = list.find(x => x.id === id);
          item.status = item.status === 'published' ? 'draft' : 'published';
          render();
        });
      });
      document.querySelectorAll('[data-delete-content]').forEach(el => {
        el.addEventListener('click', () => {
          const id = el.getAttribute('data-delete-content');
          const list = { blogs: BLOGS, news: NEWS, quotes: QUOTES }[state.contentTab];
          const idx = list.findIndex(x => x.id === id);
          list.splice(idx, 1);
          toast('Deleted.');
          render();
        });
      });
      document.querySelectorAll('[data-edit-content],[data-add-content]').forEach(el => el.addEventListener('click', () => toast('Opens the content editor.')));
    }

    render();
  </script>
</body>

</html>
