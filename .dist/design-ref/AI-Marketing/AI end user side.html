<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Marketer Practical AI products, plainly explained</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #FFFFFF;
    --surface: #F5F5F7;
    --surface-soft: #FAFAFB;
    --ink: #050038;
    --ink-deep: #000000;
    --ink-muted: #52556B;
    --hairline: #E1E3E8;
    --hairline-soft: #F0F1F4;
    
    --brand-yellow: #FFD02F;
    --brand-blue: #4262FF;
    --primary: #050038; 
    --on-primary: #FFFFFF;
    
    --footer-bg: #050038;
    --footer-text: rgba(255, 255, 255, 0.7);
    
    --rounded-full: 9999px;
    --rounded-lg: 12px;
    --rounded-xl: 16px;
    --rounded-xxxl: 28px;
    --rounded-feature: 32px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--canvas); color: var(--ink); font-family: 'Inter', sans-serif; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .display { font-family: 'Outfit', sans-serif; margin: 0; font-weight: 600; letter-spacing: -0.5px; color: var(--ink-deep); }
  h1 { font-size: 80px; line-height: 1.05; letter-spacing: -2px; }
  h2 { font-size: 48px; line-height: 1.15; letter-spacing: -1px; }
  h3 { font-size: 28px; line-height: 1.25; letter-spacing: 0; }
  a { color: inherit; text-decoration: none; }
  img, svg { display: block; max-width: 100%; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--brand-yellow); color: var(--ink-deep); }

  .wrap { max-width: 1280px; margin: 0 auto; padding: 0 32px; }
  section { padding: 96px 0; }
  .section-tight { padding: 64px 0; }

  /* ---------- Header ---------- */
  header { position: sticky; top: 0; z-index: 40; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--hairline); }
  .hd-inner { display: flex; align-items: center; justify-content: space-between; padding: 16px 32px; max-width: 1280px; margin: 0 auto; height: 72px; }
  .logo { display: flex; align-items: center; gap: 12px; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink-deep); }
  .logo .mark { width: 24px; height: 24px; flex-shrink: 0; }
  nav.mainnav { display: flex; align-items: center; gap: 24px; }
  nav.mainnav a { font-size: 14px; font-weight: 500; color: var(--ink); padding: 8px 0; }
  nav.mainnav a:hover { color: var(--brand-blue); }
  nav.mainnav a.active { color: var(--brand-blue); font-weight: 600; }
  .hd-right { display: flex; align-items: center; gap: 16px; }
  
  .btn { display: inline-flex; align-items: center; gap: 8px; border-radius: var(--rounded-full); padding: 12px 24px; font-size: 14px; font-weight: 500; white-space: nowrap; transition: background 0.2s, color 0.2s, border 0.2s; }
  .btn-primary { background: var(--primary); color: var(--on-primary); border: 1px solid var(--primary); }
  .btn-primary:hover { background: #333; border-color: #333; }
  .btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--hairline); }
  .btn-secondary:hover { background: var(--surface); }
  .btn-ghost { background: transparent; color: var(--ink); border: 1px solid transparent; padding: 8px 12px; border-radius: var(--rounded-lg); }
  .btn-ghost:hover { background: var(--surface); }
  .btn-lg { padding: 12px 24px; font-size: 14px; }

  .hamburger { display: none; border: none; background: none; padding: 6px; color: var(--ink); }
  .hamburger svg { width: 24px; height: 24px; }
  .mobile-menu { display: none; }

  @media (max-width: 1024px) {
    nav.mainnav { display: none; }
    .hamburger { display: block; }
    .hd-right .btn-primary { display: none; }
    .mobile-menu.open { display: flex; flex-direction: column; padding: 16px 32px 32px; gap: 16px; border-top: 1px solid var(--hairline); background: var(--canvas); }
    .mobile-menu a { padding: 12px 0; font-weight: 500; font-size: 16px; border-bottom: 1px solid var(--hairline-soft); }
    .mobile-menu .btn { margin-top: 16px; justify-content: center; width: 100%; }
  }

  /* ---------- Hero ---------- */
  .hero { padding: 32px 0 48px 0; text-align: center; }
  .hero h1 { max-width: 900px; margin: 0 auto; }
  .hero p.sub { font-size: 18px; color: var(--ink-muted); max-width: 600px; margin: 24px auto 40px auto; line-height: 1.5; }
  .hero-cta { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 40px; }
  
  .hero-left { text-align: left; padding: 32px 0 48px; }
  .hero-left h1 { max-width: 800px; margin: 0; }
  .hero-left p.sub { margin: 24px 0 40px 0; }
  .hero-left .hero-cta { justify-content: flex-start; }

  @media (max-width: 768px) { 
    .hero h1, .hero-left h1 { font-size: 48px; letter-spacing: -1px; } 
    .hero, .hero-left { padding: 24px 0 32px 0; }
  }
  @media (max-width: 480px) {
    .hero h1, .hero-left h1 { font-size: 36px; letter-spacing: -0.5px; }
  }

  /* ---------- Product dock ---------- */
  .dock { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 48px; }
  .dock-tile {
    border-radius: var(--rounded-xxxl); padding: 32px 24px; background: var(--tile-tint);
    display: grid; grid-template-rows: auto 1fr auto; gap: 24px; transition: transform 0.2s ease;
    border: 1px solid var(--hairline-soft); text-align: left;
    --tile-accent: var(--ink); --tile-tint: var(--surface);
  }
  .dock-tile:hover { transform: translateY(-4px); }
  .dock-icon { width: 48px; height: 48px; border-radius: var(--rounded-lg); display: flex; align-items: center; justify-content: flex-start; margin-bottom: -8px; color: var(--tile-accent);  }
  .dock-icon svg { width: 24px; height: 24px; }
  .dock-tile .t-name { font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 22px; color: var(--tile-accent); margin-bottom: 8px;}
  .dock-tile .t-hook { font-size: 14px; color: var(--tile-accent); opacity: 0.8; line-height: 1.5; }
  .dock-tile .t-go { font-size: 14px; font-weight: 600; color: var(--tile-accent); margin-top: auto; display: flex; align-items: center; gap: 4px; }
  @media (max-width: 1024px) { .dock { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 600px) { .dock { grid-template-columns: 1fr; } }

  /* ---------- Why section ---------- */
  .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; margin-top: 48px; }
  .why-item .num { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: var(--ink-muted); margin-bottom: 16px; border-bottom: 1px solid var(--hairline); padding-bottom: 8px; }
  .why-item h3 { font-size: 22px; margin-bottom: 12px; }
  .why-item p { font-size: 16px; color: var(--ink-muted); margin: 0; }
  @media (max-width: 768px) { .why-grid { grid-template-columns: 1fr; gap: 32px; } }

  /* ---------- Product cards ---------- */
  .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 32px; margin-top: 48px; }
  .pcard { border-radius: var(--rounded-xxxl); background: var(--accent-tint); overflow: hidden; display: flex; flex-direction: column; }
  .pcard-visual { aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; padding: 32px; background: rgba(255,255,255,0.4); margin: 16px 16px 0 16px; border-radius: var(--rounded-xl); }
  .pcard-visual svg { width: 100%; height: 100%; max-height: 200px; }
  .pcard-body { padding: 32px; color: var(--accent-dark); }
  .pcard h3 { font-size: 28px; margin-bottom: 12px; color: inherit; }
  .pcard .desc { font-size: 16px; opacity: 0.9; margin-bottom: 24px; }
  .pcard .learn { font-size: 14px; font-weight: 600; color: inherit; display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.5); padding: 8px 16px; border-radius: var(--rounded-full); }
  .pcard .learn svg { width: 16px; height: 16px; }
  @media (max-width: 768px) { .products-grid { grid-template-columns: 1fr; } }

  .pcard.full .pcard-body { padding: 32px; }
  .pcard.full .meta-row { display: flex; gap: 32px; margin: 24px 0; flex-wrap: wrap; background: rgba(255,255,255,0.4); padding: 24px; border-radius: var(--rounded-xl); }
  .pcard.full .meta-row div { font-size: 14px; }
  .pcard.full .meta-row .k { color: inherit; opacity: 0.6; font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }

  /* ---------- Section headers ---------- */
  .sec-head { max-width: 800px; margin-bottom: 16px; }
  .sec-head h2 { font-size: 48px; }
  .sec-head p { color: var(--ink-muted); font-size: 18px; margin-top: 16px; }

  .band { background: var(--surface-soft); border-top: 1px solid var(--hairline-soft); }

  /* ---------- Product detail hero ---------- */
  .pd-hero { padding: 80px 0 32px 0; }
  .pd-hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: center; }
  .pd-hero h1 { font-size: 60px; margin: 16px 0 24px 0; letter-spacing: -1.5px; }
  .pd-tagline { font-size: 22px; color: var(--ink-deep); max-width: 500px; margin-bottom: 24px; font-weight: 500; line-height: 1.3; }
  .pd-desc { font-size: 16px; color: var(--ink-muted); max-width: 500px; margin-bottom: 40px; }
  .pd-visual { border-radius: var(--rounded-xxxl); background: var(--accent-tint); padding: 48px; display: flex; align-items: center; justify-content: center; min-height: 400px;  }
  .pd-visual svg { width: 100%; height: auto; max-height: 320px; }
  @media (max-width: 1024px) { .pd-hero-grid { grid-template-columns: 1fr; gap: 48px; } .pd-hero h1 { font-size: 48px; } }

  .cap-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; margin-top: 48px; }
  .cap-card { border: 1px solid var(--hairline-soft); border-radius: var(--rounded-xl); padding: 32px; background: var(--canvas);  }
  .cap-card .ic { width: 48px; height: 48px; border-radius: var(--rounded-lg); background: var(--accent-tint); color: var(--accent-dark); display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
  .cap-card .ic svg { width: 24px; height: 24px; }
  .cap-card h4 { font-size: 22px; margin-bottom: 12px; }
  .cap-card p { font-size: 16px; color: var(--ink-muted); margin: 0; line-height: 1.5; }
  @media (max-width: 768px) { .cap-grid { grid-template-columns: 1fr; } }

  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 48px; }
  .gallery-tile { aspect-ratio: 1; border-radius: var(--rounded-xl); background: var(--accent-tint); display: flex; align-items: center; justify-content: center; padding: 24px; }
  .gallery-tile svg { width: 80%; height: 80%; }
  @media (max-width: 768px) { .gallery-grid { grid-template-columns: 1fr 1fr; } }

  .cta-band { background: var(--primary); color: var(--on-primary); border-radius: var(--rounded-feature); padding: 64px; display: flex; align-items: center; justify-content: space-between; gap: 32px; flex-wrap: wrap; text-align: left; }
  .cta-band h3 { font-size: 36px; color: var(--on-primary); max-width: 500px; letter-spacing: -0.5px; }
  .cta-band p { color: rgba(255,255,255,0.8); font-size: 18px; margin-top: 16px; max-width: 500px; }
  .cta-band .btn-primary { background: var(--on-primary); color: var(--primary); border-color: var(--on-primary); }
  .cta-band .btn-primary:hover { background: var(--hairline); border-color: var(--hairline); }

  /* ---------- Who for ---------- */
  .who-row { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; align-items: start; margin-top: 24px; background: var(--surface-soft); padding: 48px; border-radius: var(--rounded-xxxl); }
  .who-row h3 { font-size: 22px; margin-bottom: 16px; }
  .who-row p { font-size: 16px; color: var(--ink-muted); line-height: 1.6; }
  @media (max-width: 768px) { .who-row { grid-template-columns: 1fr; gap: 32px; padding: 32px; } }

  /* ---------- Blog / News lists ---------- */
  .post-list { display: flex; flex-direction: column; margin-top: 48px; }
  .post { border-top: 1px solid var(--hairline); padding: 40px 0; cursor: pointer; transition: background 0.2s; }
  .post:hover { background: var(--surface-soft); padding-left: 24px; padding-right: 24px; margin-left: -24px; margin-right: -24px; border-radius: var(--rounded-xl); border-top-color: transparent; }
  .post:last-child { border-bottom: 1px solid var(--hairline); }
  .post:hover:last-child { border-bottom-color: transparent; }
  .post-top { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
  .post h3 { font-size: 24px; }
  .post .tag { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--brand-blue); background: rgba(66,98,255,0.1); padding: 4px 12px; border-radius: var(--rounded-full); white-space: nowrap; }
  .post .date { font-size: 14px; color: var(--ink-muted); margin-top: 8px; }
  .post .excerpt { font-size: 16px; color: var(--ink-muted); margin-top: 16px; max-width: 800px; line-height: 1.6; }
  .post .full { font-size: 16px; color: var(--ink); margin-top: 24px; max-width: 800px; display: none; line-height: 1.7; }
  .post.open .full { display: block; }
  .post .readmore { font-size: 14px; font-weight: 600; color: var(--brand-blue); margin-top: 16px; display: inline-flex; align-items: center; gap: 4px; }

  /* ---------- About ---------- */
  .about-list { display: flex; flex-direction: column; gap: 0; margin-top: 24px; }
  .about-list .row { display: grid; grid-template-columns: 200px 1fr; gap: 32px; padding: 32px 0; border-top: 1px solid var(--hairline); }
  .about-list .row:last-child { border-bottom: 1px solid var(--hairline); }
  .about-list .row .k { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; color: var(--ink-deep); text-transform: uppercase; letter-spacing: 0.5px; }
  .about-list .row p { margin: 0; font-size: 18px; color: var(--ink-muted); max-width: 700px; line-height: 1.6; }

  /* ---------- Contact ---------- */
  .contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: 48px; }
  .field { margin-bottom: 24px; }
  .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; color: var(--ink-deep); }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--hairline); border-radius: var(--rounded-lg); padding: 12px 16px; font-size: 16px; font-family: inherit; background: var(--canvas); color: var(--ink); transition: border 0.2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand-blue);  }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .contact-info { padding: 48px; border-radius: var(--rounded-xxxl); background: var(--surface-soft); height: fit-content; }
  .contact-info h3 { font-size: 22px; margin-bottom: 24px; }
  .contact-info .ci-row { display: flex; gap: 24px; padding: 16px 0; border-top: 1px solid var(--hairline); font-size: 15px; }
  .contact-info .ci-row:first-of-type { border-top: none; padding-top: 0; }
  .contact-info .ci-row .lab { color: var(--ink-muted); width: 80px; flex-shrink: 0; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
  .confirm { background: #E8F5E9; border: 1px solid #C8E6C9; border-radius: var(--rounded-xl); padding: 24px; display: none; margin-bottom: 32px; }
  .confirm.show { display: block; }
  .confirm h3 { color: #2E7D32; font-size: 18px; margin-bottom: 8px; }
  .confirm p { font-size: 15px; color: #1B5E20; margin: 0; }
  @media (max-width: 820px) { .contact-grid { grid-template-columns: 1fr; } .field-row { grid-template-columns: 1fr; } }

  /* ---------- Footer ---------- */
  footer { background: var(--footer-bg); color: var(--footer-text); margin-top: 64px; }
  .foot-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; padding: 80px 0 48px 0; }
  .foot-brand .logo { margin-bottom: 16px; color: var(--on-primary); font-size: 24px; }
  .foot-brand p { font-size: 15px; color: var(--footer-text); max-width: 300px; line-height: 1.6; }
  .foot-col h4 { font-size: 14px; color: var(--on-primary); margin-bottom: 24px; font-weight: 600; letter-spacing: 0; }
  .foot-col a { display: block; font-size: 15px; color: var(--footer-text); padding: 6px 0; transition: color 0.2s; }
  .foot-col a:hover { color: var(--on-primary); }
  .foot-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding: 24px 0; display: flex; justify-content: space-between; font-size: 14px; color: var(--footer-text); flex-wrap: wrap; gap: 16px; }
  @media (max-width: 768px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 40px 24px; } .foot-brand { grid-column: span 2; } }

  .toast { position: fixed; bottom: 32px; right: 32px; background: var(--ink); color: #fff; padding: 16px 24px; border-radius: var(--rounded-lg); font-size: 15px; font-weight: 500;  z-index: 100; }

  .view { animation: fade 0.3s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .news-item { display: grid; grid-template-columns: 240px 1fr; gap: 32px; align-items: start; }
  @media (max-width: 768px) { .news-item { grid-template-columns: 1fr; gap: 16px; } }
  .news-item img { width: 100%; height: 160px; object-fit: cover; border-radius: var(--rounded-xl); }
</style>
</head>

<script>

  guide:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>',

function svgPod(){ // task board illustration

/* ============================= STATE ============================= */
const state = { route:'home', mobileOpen:false, contactProduct:'General Enquiry', openPost:null, toast:null };

function go(route, opts){
  state.route = route;
  state.mobileOpen = false;
  if(opts) Object.assign(state, opts);
  render();
  window.scrollTo({top:0, behavior:'instant' in window ? 'instant':'auto'});
}
function toastMsg(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }

/* ============================= RENDER ============================= */
function render(){
  document.getElementById('app').innerHTML = `
    ${renderHeader()}
    <main class="view">${renderRoute()}</main>
    ${renderFooter()}
    ${state.toast?`<div class="toast">${state.toast}</div>`:''}
  `;
  attachHandlers();
}

function renderHeader(){
  const isProducts = state.route==='products' || (state.route.startsWith('product-'));
  const link = (r,label)=>`<a href="#" data-nav="${r}" class="${state.route===r || (r==='products'&&isProducts) ?'active':''}">${label}</a>`;
  return `
  <header>
    <div class="hd-inner">
      <a href="#" data-nav="home" class="logo"><img src="favicon.svg" class="mark" alt="Logo">AI Marketer</a>
      <nav class="mainnav">
        ${link('home','Home')}${link('products','Products')}${link('news','News')}${link('about','About')}${link('contact','Contact')}
      </nav>
      <div class="hd-right">
        <button class="btn btn-secondary" data-nav="contact" style="border-color:transparent;">Contact sales</button>\n        <button class="btn btn-primary" data-nav="products">Get started free</button>
        <button class="hamburger" id="hamburger-btn">${state.mobileOpen?ICONS.close:ICONS.menu}</button>
      </div>
    </div>
    <div class="mobile-menu ${state.mobileOpen?'open':''}">
      ${link('home','Home')}${link('products','Products')}${link('news','News')}${link('about','About')}${link('contact','Contact')}
      <button class="btn btn-secondary" data-nav="contact" style="border-color:transparent;">Contact sales</button>\n        <button class="btn btn-primary" data-nav="products">Get started free</button>
    </div>
  </header>`;
}

function renderRoute(){
  if(state.route==='home') return renderHome();
  if(state.route==='products') return renderProductsOverview();
  if(state.route.startsWith('product-')) return renderProductDetail(product(state.route.replace('product-','')));
  
  if(state.route==='news') return renderNews();
  if(state.route==='about') return renderAbout();
  if(state.route==='contact') return renderContact();
  return '';
}

/* ============================= EVENTS ============================= */
function attachHandlers(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      const r = el.getAttribute('data-nav');
      const preset = el.getAttribute('data-preset-product');
      go(r, preset ? {contactProduct:preset} : {contactProduct: r==='contact' ? state.contactProduct : state.contactProduct});
    });
  });
  const ham = document.getElementById('hamburger-btn');
  if(ham) ham.addEventListener('click', ()=>{ state.mobileOpen = !state.mobileOpen; render(); });

  document.querySelectorAll('[data-toggle-post]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-toggle-post');
      state.openPost = state.openPost===id ? null : id;
      render();
    });
  });

  const form = document.getElementById('contact-form');
  if(form) form.addEventListener('submit', (e)=>{
    e.preventDefault();
    document.getElementById('confirm-box').classList.add('show');
    form.reset();
    toastMsg('Message sent thanks for reaching out.');
  });
}

render();
</script>
</body>
</html>
